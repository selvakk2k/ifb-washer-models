[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifb-washer-models"
version = "1.0.1"
description = "Hardware profiles, capability gating rules, and model database for IFB smart washing machines and washer-dryers (Indian Market)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Selvakumar K", email = "selvakk2k@users.noreply.github.com" }
]
keywords = [
    "ifb",
    "washing-machine",
    "washer-dryer",
    "home-assistant",
    "iot",
    "hardware-database",
    "smart-appliances"
]

[project.urls]
Homepage = "https://github.com/selvakk2k/ifb-washer-models"
Documentation = "https://github.com/selvakk2k/ifb-washer-models#readme"
Repository = "https://github.com/selvakk2k/ifb-washer-models.git"
Issues = "https://github.com/selvakk2k/ifb-washer-models/issues"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["ifb_washer_models*"]

[tool.setuptools.package-data]
ifb_washer_models = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
